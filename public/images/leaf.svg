<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 240 480">

    <defs>

        <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D6B892"/>
            <stop offset="100%" stop-color="#9D7550"/>
        </linearGradient>

        <linearGradient id="stemGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#B68652"/>
            <stop offset="100%" stop-color="#7C5B3B"/>
        </linearGradient>

    </defs>

    <!-- Stem -->

    <path
        d="M120 20
           C118 120 122 180 118 260
           C116 320 120 380 118 460"
        stroke="url(#stemGradient)"
        stroke-width="2.2"
        fill="none"
        stroke-linecap="round"/>

    <!-- LEFT -->

    <g opacity=".8">

        <path
            d="
            M118 85
            C78 60 48 70 35 110
            C68 106 98 98 118 85Z"
            fill="url(#leafGradient)"/>

        <path
            d="M118 85
               C95 95 70 102 45 108"
            stroke="#F5E7D4"
            stroke-width="1.2"
            fill="none"/>

    </g>

    <!-- RIGHT -->

    <g opacity=".8">

        <path
            d="
            M120 145
            C158 120 195 130 210 170
            C172 168 145 160 120 145Z"
